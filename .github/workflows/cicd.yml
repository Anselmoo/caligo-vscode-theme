          ls -la public/screenshots || true

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-release
          path: public/screenshots/
          if-no-files-found: error
          retention-days: 90

  e2e-tests:
    name: E2E Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
      options: --user root
    steps:
      - uses: actions/checkout@v6
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - name: Build app
        run: npm run pages:build
        env:
          VITE_BASE: /caligo-vscode-theme/
      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true
      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-vsix:
    name: Build VSIX
    needs: [unit-tests, e2e-tests]
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - name: Build VSIX
        run: npm run marketplace:package
      - name: Find VSIX
        id: find_vsix
        run: |
          shopt -s nullglob
          vsix_files=( *.vsix )
          if [ ${#vsix_files[@]} -eq 0 ]; then
            echo "No VSIX found"
            exit 1
          fi
          VSIX="${vsix_files[0]}"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: ${{ steps.find_vsix.outputs.vsix }}
          retention-days: 30

  build-pages-main:
    name: Build Pages (main)
    needs: [unit-tests, screenshots]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm
      - uses: actions/configure-pages@v5
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      - run: npm ci
      - name: Download Screenshots
        uses: actions/download-artifact@v7
        with:
          name: screenshots
          path: public/screenshots/
      - name: Build pages
        run: npm run pages:build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Upload Screenshots Manifest
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-manifest
          path: public/screenshots-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  build-pages-other:
    name: Build Pages (non-main)
    needs: unit-tests
    if: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - name: Build pages
        run: npm run pages:build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy Pages
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: build-pages-main
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-gate:
    name: Release Gate
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [build-vsix, screenshots-release]
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check release readiness
        id: check
        run: |
          if [[ "${{ needs.build-vsix.result }}" == "success" ]] && \
             [[ "${{ needs.screenshots-release.result }}" == "success" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release checks passed"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "❌ Release checks failed"
            exit 1
          fi

  release-github:
    name: Release - GitHub
    if: ${{ needs.release-gate.outputs.ready == 'true' }}
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: github-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v7
        with:
          name: vsix
          path: artifacts/vsix
      - name: Create GitHub Release (gh)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Caligo $TAG" \
            --notes "## Caligo ${VERSION}

          ### 📦 Installation
          \`\`\`bash
          code --install-extension AnselmHahn.caligo-vscode-theme@${VERSION}
          \`\`\`

          ### 🔗 Links
          - [Marketplace](https://marketplace.visualstudio.com/items?itemName=AnselmHahn.caligo-vscode-theme)
          - [Gallery](https://anselmoo.github.io/caligo-vscode-theme/#/gallery)
          - [Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
      - name: Upload VSIX to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VSIX_FILE=$(find artifacts/vsix -maxdepth 1 -type f -name '*.vsix' -print -quit)
          if [ -z "$VSIX_FILE" ]; then echo "No VSIX file found" && exit 1; fi
          gh release upload "${{ github.ref_name }}" "$VSIX_FILE" \
            --repo "${{ github.repository }}" \
            --clobber
      - name: Release summary
        run: |
          echo "### GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "✅ Release ${{ github.ref_name }} created" >> $GITHUB_STEP_SUMMARY
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  release-marketplace:
    name: Release - VS Code Marketplace
    if: ${{ needs.release-gate.outputs.ready == 'true' }}
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace-release
      url: https://marketplace.visualstudio.com/items?itemName=AnselmHahn.caligo-vscode-theme
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v7
        with:
          name: vsix
          path: artifacts/vsix
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
      - name: Publish to Visual Studio Marketplace
        run: |
          VSIX_FILE=$(find artifacts/vsix -maxdepth 1 -type f -name '*.vsix' -print -quit)
          if [ -z "$VSIX_FILE" ]; then echo "No VSIX file found" && exit 1; fi
          npx vsce publish --no-dependencies --packagePath "$VSIX_FILE" --pat "${{ secrets.VSCE_PAT }}"
      - name: Marketplace release summary
        if: always()
        run: |
          echo "### VS Code Marketplace" >> $GITHUB_STEP_SUMMARY
          echo "✅ Version ${{ github.ref_name }} published to Marketplace" >> $GITHUB_STEP_SUMMARY
          echo "🔗 https://marketplace.visualstudio.com/items?itemName=AnselmHahn.caligo-vscode-theme" >> $GITHUB_STEP_SUMMARY

  release-ghcr:
    name: Release - GHCR Docker Image
    if: ${{ needs.release-gate.outputs.ready == 'true' }}
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: ghcr-release
      url: https://github.com/${{ github.repository_owner }}?tab=packages&repo_name=${{ github.event.repository.name }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Compute image coordinates
        id: image
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/docker/vscode-playwright.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner_lc }}/caligo-vscode-playwright:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.owner_lc }}/caligo-vscode-playwright:${{ steps.image.outputs.version }}
            ghcr.io/${{ steps.image.outputs.owner_lc }}/caligo-vscode-playwright:latest
      - name: GHCR release summary
        if: always()
        run: |
          echo "### GHCR Docker Image" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.build-push.outcome }}" == "success" ]]; then
            echo "✅ Docker image pushed for ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            echo "🔗 ghcr.io/${{ steps.image.outputs.owner_lc }}/caligo-vscode-playwright:${{ steps.image.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Docker image push failed for ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          fi

  release-github-packages:
    name: Release - GitHub Packages (npm)
    if: ${{ needs.release-gate.outputs.ready == 'true' }}
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: github-packages-release
      url: https://github.com/${{ github.repository_owner }}?tab=packages&repo_name=${{ github.event.repository.name }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@anselmoo'
      - run: npm ci
      - name: Build and generate themes
        run: |
          npm run build
          npm run generate
      - name: Prepare temporary npm publish workspace
        run: npm run package:theme-data:prepare
        env:
          CALIGO_THEME_DATA_VERSION: ${{ github.ref_name }}
      - name: Publish package
        id: npm-publish
        run: npm publish ./build/github-packages/caligo-theme-data
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: GitHub Packages release summary
        if: always()
        run: |
          echo "### GitHub Packages (npm)" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.npm-publish.outcome }}" == "success" ]]; then
            echo "✅ @anselmoo/caligo-theme-data published for ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ @anselmoo/caligo-theme-data publish failed for ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          fi

  # Keep Pages independent from package/image publishing:
  # release-pages must run from release-gate even if release-ghcr or release-github-packages fails.
  release-pages:
    name: Release - Deploy Pages
    if: ${{ needs.release-gate.outputs.ready == 'true' }}
    needs: release-gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Download Screenshots
        uses: actions/download-artifact@v7
        with:
          name: screenshots-release
          path: public/screenshots/
      - name: Build pages
        run: npm run pages:build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Upload Screenshots Manifest
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-manifest-release
          path: public/screenshots-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Release pages summary
        if: always()
        run: |
          echo "### Release Pages" >> $GITHUB_STEP_SUMMARY
          echo "✅ Pages release deployment completed for ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ Pages deployment is intentionally independent from GHCR/npm publish jobs" >> $GITHUB_STEP_SUMMARY
          echo "🔗 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY

  release-sbom:
    name: Release - SBOM
    if: ${{ needs.release-gate.outputs.ready == 'true' }}
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci
      - name: Download VSIX artifact
        uses: actions/download-artifact@v7
        with:
          name: vsix
          path: artifacts/vsix
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: sbom-spdx.json
          output-file: sbom-spdx.json
          format: spdx-json
      - name: Upload SBOM to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" sbom-spdx.json \
            --repo "${{ github.repository }}" \
            --clobber
      - name: SBOM summary
        if: always()
        run: |
          echo "### SBOM" >> $GITHUB_STEP_SUMMARY
          echo "✅ SBOM generated and attached to release ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
