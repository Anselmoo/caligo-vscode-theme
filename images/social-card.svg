<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f1118;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#232834;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00c098;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#00b4d8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#9b90ff;stop-opacity:1" />
        </linearGradient>

        <!-- Inner Glow for the Ring -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="12" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        
        <!-- Safe margin guide (40pt = ~53px at 96 DPI) -->
        <!-- This guide rect shows the safe area but is not rendered -->
    </defs>
    
    <!-- Background -->
    <rect width="1280" height="640" fill="url(#bg-gradient)" />
    
    <!-- Subtle Grid (within safe area) -->
    <path d="M53 160 H1227 M53 320 H1227 M53 480 H1227" stroke="white" stroke-width="1" opacity="0.03"/>
    
    <!-- Icon Element (positioned with safe margin consideration) -->
    <!-- 40pt safe margin = ~53px, so icon starts at x=93 (53 + 40 for padding) -->
    <g transform="translate(93, 120) scale(0.55)">
        <circle cx="256" cy="256" r="170" fill="none" stroke="url(#text-gradient)" stroke-width="24" opacity="0.9" filter="url(#glow)" />
        <path d="M350.5 182 A 120 120 0 1 0 350.5 330" stroke="url(#text-gradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Text Content (positioned within safe margins) -->
    <!-- Main title: positioned at x=400 (well within safe margin) -->
    <text x="400" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="120" fill="url(#text-gradient)" letter-spacing="-2">Caligo</text>
    
    <!-- Subtitle: positioned within safe area -->
    <text x="405" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="300" font-size="38" fill="url(#text-gradient)" opacity="0.6" letter-spacing="1">Perceptual Dark Themes</text>
    
    <!-- Additional info: positioned within safe area -->
    <text x="405" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="300" font-size="32" fill="url(#text-gradient)" opacity="0.5" letter-spacing="0.5">OKLCH Color Harmony • 50 Themes</text>
    
    <!-- Safe margin boundary indicator (for reference, remove in production if desired) -->
    <!-- This shows the 40pt (~53px) safe zone boundary -->
    <rect x="53" y="53" width="1174" height="534" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="10,5"/>
</svg>
